<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>

    <filter id="blurBig"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#space-bg)"/>

  <!-- drifting nebula clouds -->
  <circle cx="220" cy="90" r="160" fill="url(#nebula1)" filter="url(#blurBig)">
    <animate attributeName="cx" values="220;280;220" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="200" r="180" fill="url(#nebula2)" filter="url(#blurBig)">
    <animate attributeName="cx" values="950;880;950" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="180" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="60" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="230" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="45" r="1.4"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="210" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="150" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="50" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="230" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="30" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="140" r="1" ><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="120" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="70" y2="14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 1250,90; 0,0" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- glowing planet with ring -->
  <g transform="translate(1035,150)">
    <ellipse cx="0" cy="0" rx="70" ry="16" fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.5" transform="rotate(-18)"/>
    <circle r="34" fill="url(#planetGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="0" cy="0" rx="70" ry="16" fill="none" stroke="#BFDBFE" stroke-width="1.5" opacity="0.35" transform="rotate(-18)"/>
  </g>

  <!-- title -->
  <text x="120" y="130" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="700" fill="#F8FAFC">
    PHÙNG QUAN QUY
  </text>
  <text x="120" y="165" font-family="Segoe UI, Verdana, sans-serif" font-size="19" fill="#93C5FD">
    Exploring code like a universe &#183; IT Student &amp; Developer
  </text>
  <rect x="120" y="182" width="260" height="3" rx="1.5" fill="#7C3AED">
    <animate attributeName="width" values="40;260;40" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
